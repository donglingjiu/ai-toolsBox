<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,initial-scale=1">
<title>表格工具 · Nova 工具箱</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,'PingFang SC',
  'Microsoft YaHei',sans-serif;background:#fafaf7;color:#333}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
.top a{color:#4a6fa5;text-decoration:none;font-size:13px}
h1{font-size:20px;margin:8px 0 4px}
.hint{font-size:12px;color:#98938a;margin:6px 0;font-weight:400}
.card{background:#fff;border:1px solid #e8e8e2;border-radius:14px;
  padding:18px;margin:16px 0}
.card h2{font-size:15px;margin:0 0 10px;color:#444}
.mbtn{padding:8px 18px;border:0;border-radius:10px;cursor:pointer;
  background:#e8836f;color:#fff;font-size:13px;margin-right:8px}
.mbtn.alt{background:#5b9aa9}
.file{font-size:13px}
select{padding:7px 10px;border:1px solid #e0ddd6;
  border-radius:8px;font-size:13px;margin:8px 0}
table{border-collapse:collapse;font-size:12px;margin-top:8px}
td{border:1px solid #eee7dd;padding:4px 8px;white-space:nowrap;
  max-width:180px;overflow:hidden;text-overflow:ellipsis}
tr:first-child td{background:#faf6f0;font-weight:600}
.st{font-size:12px;color:#697086}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="index.html">&larr; 返回工具箱</a>
  </div>
  <h1>表格工具
    <span class="hint">纯浏览器本地处理，文件不出本机</span>
  </h1>
  <div class="card">
    <h2>Excel / CSV 读取与转换</h2>
    <input id="x-file" class="file" type="file"
      accept=".xlsx,.xls,.csv">
    <div><select id="x-sheet"></select></div>
    <div id="x-prev"></div>
    <p>
      <button id="x-csv" class="mbtn" type="button">导出 CSV</button>
      <button id="x-json" class="mbtn alt" type="button">导出 JSON</button>
      <span id="x-st" class="st"></span>
    </p>
  </div>
</div>
<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/excel-tools.js"></script>
<script src="js/guard.js"></script>
</body>
</html>
