<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 对话工作台</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f8fb;--card:#fff;--line:#e5e9f0;--ink:#1f2937;
--muted:#6b7280;--pri:#2563eb;--me:#eff6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.6 -apple-system,"PingFang SC",sans-serif;
background:var(--bg);color:var(--ink);height:100vh;display:flex}
#side{width:260px;background:var(--card);
border-right:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:14px}
#side header button{width:100%;padding:8px;border:0;border-radius:8px;
background:var(--pri);color:#fff;font-size:14px;cursor:pointer}
#search{margin:0 14px 10px;padding:8px;border:1px solid var(--line);
border-radius:8px;font-size:13px;width:calc(100% - 28px)}
#sessList{flex:1;overflow:auto;padding:0 8px}
.sess{padding:10px;border-radius:8px;cursor:pointer;display:flex;
justify-content:space-between;align-items:center;gap:6px}
.sess:hover{background:var(--bg)}
.sess.on{background:var(--me);color:var(--pri);font-weight:600}
.sess .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .del{border:0;background:none;color:var(--muted);cursor:pointer}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;
background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top select,#top button{padding:6px 10px;border:1px solid var(--line);
border-radius:8px;background:#fff;font-size:13px;cursor:pointer}
#sysInp{flex:1;min-width:140px;padding:6px 10px;
border:1px solid var(--line);border-radius:8px;font-size:13px}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;
flex-direction:column;gap:14px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;
word-break:break-word}
.msg.user{align-self:flex-end;background:var(--pri);color:#fff}
.msg.assistant{align-self:flex-start;background:var(--card);
border:1px solid var(--line)}
.msg .st{font-size:11px;color:var(--muted);margin-top:4px}
#inputBar{display:flex;gap:10px;padding:12px 16px;
background:var(--card);border-top:1px solid var(--line)}
#inp{flex:1;resize:none;padding:10px 12px;
border:1px solid var(--line);border-radius:10px;font:inherit;height:64px}
#send,#stop{padding:0 22px;border:0;border-radius:10px;
background:var(--pri);color:#fff;font-size:15px;cursor:pointer}
#stop{background:#e5484d;display:none}
</style>
</head>
<body>
<aside id="side">
  <header><button id="newBtn">＋ 新对话</button></header>
  <input id="search" placeholder="搜索对话…">
  <div id="sessList"></div>
</aside>
<main id="main">
  <div id="top">
    <button id="menuBtn">☰</button>
    <select id="modelSel"></select>
    <input id="sysInp" placeholder="系统提示词（可空）">
    <button id="expBtn">导出.md</button>
  </div>
  <div id="msgs"></div>
  <div id="inputBar">
    <textarea id="inp" placeholder="Enter 发送 · Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
    <button id="stop">停止</button>
  </div>
</main>
<script src="js/app.js"></script>
<script>
'use strict';
var KEY='chat_sessions_v1', sessions=[], curId=null, ctrl=null;
function q(s){return document.querySelector(s)}
function mk(tag,attrs){var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k.slice(0,2)=='on')e[k.slice(2)]=attrs[k];
    else e.setAttribute(k,attrs[k])}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];
    e.appendChild(typeof c=='string'?document.createTextNode(c):c)}
  return e}
function mdr(t){try{
    return window.mdRender?mdRender(t)
      :t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/\n/g,'<br>')}
  catch(e){return t}}
function tst(m){try{toast(m)}catch(e){console.log('[chat]',m)}}
function dl(n,c){try{downloadText(n,c,'text/markdown;charset=utf-8')}
  catch(e){var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([c]));a.download=n;a.click()}}
function load(){try{sessions=JSON.parse(localStorage.getItem(KEY)||'[]')}
  catch(e){sessions=[]}
  sessions.forEach(function(s){var m=s.messages;
    while(m.length&&m[m.length-1].role==='assistant'
      &&!m[m.length-1].content){m.pop();}});}
function save(){localStorage.setItem(KEY,JSON.stringify(sessions))}
function cur(){for(var i=0;i<sessions.length;i++)
  if(sessions[i].id===curId)return sessions[i];return null}
function uid(){return 'c'+Date.now().toString(36)
  +Math.random().toString(36).slice(2,6)}
function newSess(){var s={id:uid(),title:'新对话',profileId:'',
  system:'',messages:[],updatedAt:Date.now()};
  sessions.unshift(s);curId=s.id;save();renderAll();return s}
function delSess(id){
  sessions=sessions.filter(function(s){return s.id!==id});
  if(curId===id)curId=sessions.length?sessions[0].id:null;
  save();if(!cur())newSess();else renderAll()}
function title(s){return s.messages.length
  ?(s.messages[0].content.slice(0,18)||s.title):s.title}
function renderSess(f){var box=q('#sessList');box.innerHTML='';
  sessions.slice().sort(function(a,b){return b.updatedAt-a.updatedAt})
  .forEach(function(s){
    if(f&&(title(s)+JSON.stringify(s.messages)).toLowerCase()
      .indexOf(f.toLowerCase())<0)return;
    box.appendChild(mk('div',
      {class:'sess'+(s.id===curId?' on':''),
       onclick:function(){curId=s.id;renderAll();
         if(innerWidth<=720)q('#side').classList.remove('open')}},
      mk('span',{class:'t',ondblclick:function(){
        var t=prompt('重命名',s.title);
        if(t){s.title=t;save();
          renderSess(q('#search').value)}}},title(s)),
      mk('button',{class:'del',onclick:function(ev){
        ev.stopPropagation();
        if(confirm('删除「'+title(s)+'」？'))delSess(s.id)}},'✕')))})}
function renderMsgs(){var box=q('#msgs');box.innerHTML='';
  var s=cur();if(!s)return;
  s.messages.forEach(function(m){
    var d=mk('div',{class:'msg '+m.role});
    if(m.role==='assistant')d.innerHTML=mdr(m.content);
    else d.textContent=m.content;
    d.appendChild(mk('div',{class:'st'},
      new Date(m.ts||Date.now()).toLocaleTimeString()));
    box.appendChild(d)});
  box.scrollTop=box.scrollHeight}
function renderModels(){var sel=q('#modelSel');sel.innerHTML='';
  var ps=[];try{ps=getProfiles()||[]}catch(e){}
  ps.forEach(function(p){sel.appendChild(mk('option',{value:p.id},
    (p.name||'未命名')+' · '+(p.model||'')))});var c=cur();
  if(c&&c.profileId)sel.value=c.profileId}
function renderAll(){if(!cur()){
    if(sessions.length)curId=sessions[0].id;
    else{newSess();return}}
  var c=cur();q('#sysInp').value=c.system||'';
  renderModels();renderSess(q('#search').value);renderMsgs()}
function busy(b){q('#send').style.display=b?'none':'block';
  q('#stop').style.display=b?'block':'none'}
function modelReady(){try{
    return typeof llmReady==='function'
      ?llmReady():(getProfiles()||[]).length>0}
  catch(e){return false}}
function send(){var s=cur(),txt=q('#inp').value.trim();
  if(!txt||ctrl)return;
  if(!modelReady()){tst('请先到「设置」页配置模型 API');return}
  s.profileId=q('#modelSel').value;
  s.system=q('#sysInp').value.trim();
  var asst={role:'assistant',content:'',ts:Date.now()};
  s.messages.push({role:'user',content:txt,ts:Date.now()});
  s.messages.push(asst);s.updatedAt=Date.now();
  q('#inp').value='';save();renderAll();busy(true);
  var msgs=[];
  if(s.system)msgs.push({role:'system',content:s.system});
  try{if(window.ChatHooks&&ChatHooks.beforeSend)
    msgs=ChatHooks.beforeSend(msgs,s)||msgs}catch(e){}
  s.messages.forEach(function(m){
    if(m!==asst&&m.content)
      msgs.push({role:m.role,content:m.content})});
  ctrl=new AbortController();
  (window.Agent?Agent.run:llmChat)(msgs,{signal:ctrl.signal,
    onProfile:function(n){tst('模型：'+n)},
    onDelta:function(d,full){asst.content=full;
      var a=document.querySelectorAll('.msg.assistant');
      var last=a[a.length-1];
      if(last)last.innerHTML=mdr(full);
      q('#msgs').scrollTop=q('#msgs').scrollHeight}})
  .then(function(full){asst.content=full||asst.content})
  .catch(function(e){
    var m=e.name==='AbortError'?'已中断':e.message;
    asst.content+=(asst.content?'\n\n':'')+'⚠ '+m;tst(m)})
  .finally(function(){ctrl=null;s.updatedAt=Date.now();
    save();renderAll();busy(false);try{window.Mem&&Mem.onExchange(s);}catch(e){}})}
q('#send').onclick=send;
q('#stop').onclick=function(){if(ctrl)ctrl.abort()};
q('#newBtn').onclick=newSess;
q('#menuBtn').onclick=function(){q('#side').classList.toggle('open')};
q('#search').oninput=function(){renderSess(this.value)};
q('#inp').onkeydown=function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
q('#sysInp').onchange=function(){var c=cur();
  if(c){c.system=this.value;save()}};
q('#modelSel').onchange=function(){var c=cur();
  if(c){c.profileId=this.value;save()}};
q('#expBtn').onclick=function(){var c=cur();if(!c)return;
  var md='# '+title(c)+'\n\n'+c.messages.map(function(m){
    return '**'+(m.role==='user'?'我':'AI')+'**：'+m.content}
    ).join('\n\n---\n\n');
  dl(title(c)+'.md',md)};
load();if(!sessions.length)newSess();renderAll();
</script>
<script src="js/chat-probe.js?v=3"></script>
<script src="js/memory.js?v=1"></script>
<script src="js/agent.js?v=1"></script>
<script src="js/agent-extra.js?v=1"></script>
</body>
</html>
