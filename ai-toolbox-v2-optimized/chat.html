<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 对话工作台 · Nova</title>
<style>
:root{--bg:#f6f8fc;--panel:rgba(255,255,255,.86);--line:rgba(15,23,42,.08);--ink:#1e293b;--sub:#64748b;--acc:#5b6cff;--grad:linear-gradient(135deg,#5b6cff,#8a5bff)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 85% -10%,#e4ebff 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#eee6ff 0%,transparent 55%),var(--bg);color:var(--ink)}
.chat-app{display:flex;height:100vh}
.chat-side{width:264px;flex:none;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(18px);border-right:1px solid var(--line)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.logo{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:16px}
.new-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.new-btn:hover{border-color:var(--acc);color:var(--acc)}
.side-list{flex:1;overflow-y:auto;padding:6px 10px}
.sess-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;margin-bottom:2px}
.sess-item:hover{background:rgba(91,108,255,.08)}
.sess-item.cur{background:linear-gradient(90deg,rgba(91,108,255,.14),rgba(138,91,255,.06));outline:1px solid rgba(91,108,255,.25)}
.sess-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-item .d{font-size:11px;color:var(--sub)}
.sess-item .x{flex:none;border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px;visibility:hidden}
.sess-item:hover .x{visibility:visible}
.sess-item .x:hover{color:#e11d48;background:rgba(225,29,72,.08)}
.side-nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 14px 4px}.side-nav a{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;background:rgba(255,255,255,.65)}.side-nav a:hover{color:var(--acc);border-color:rgba(91,108,255,.5)}.side-empty{padding:24px 12px;text-align:center;color:var(--sub);font-size:12px}
.side-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px}
.side-foot a{color:var(--sub);text-decoration:none}
.side-foot a:hover{color:var(--acc)}
.mini-btn{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:8px}
.mini-btn:hover{color:var(--acc);background:rgba(91,108,255,.08)}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-top{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--panel);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer}
.model-tag{font-size:13px;color:var(--sub)}
.model-tag b{color:var(--ink)}
.skill-btn{margin-left:auto;border:1px solid rgba(91,108,255,.35);background:rgba(91,108,255,.08);color:var(--acc);border-radius:10px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
.skill-btn:hover{background:rgba(91,108,255,.15)}
.chat-scroll{flex:1;overflow-y:auto;padding:26px 18px 10px}
.chat-inner{max-width:780px;margin:0 auto}
.msg{display:flex;gap:12px;margin-bottom:18px}
.avatar{width:32px;height:32px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.msg.user .avatar{background:rgba(100,116,139,.12);color:var(--sub)}
.msg.ai .avatar{background:var(--grad);color:#fff}
.body{min-width:0;flex:1}
.who{font-size:11px;color:var(--sub);margin-bottom:4px}
.bubble{font-size:14.5px;line-height:1.75;word-break:break-word}
.msg.user .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:inline-block}
.bubble p{margin:0 0 10px}
.bubble p:last-child{margin-bottom:0}
.bubble h2,.bubble h3,.bubble h4{margin:14px 0 8px;font-size:1.05em}
.bubble ul{margin:6px 0 10px 18px}
.bubble li{margin:3px 0}
.bubble code{background:rgba(91,108,255,.1);color:#4338ca;border-radius:5px;padding:1px 5px;font-size:.92em;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.bubble pre{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:14px;overflow-x:auto;margin:10px 0}
.bubble pre code{background:transparent;color:inherit;padding:0}
.bubble a{color:var(--acc)}
.msg-actions{display:flex;gap:8px;margin-top:6px}
.act{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11px;color:var(--sub);cursor:pointer;padding:3px 9px}
.act:hover{color:var(--acc);border-color:var(--acc)}
.err{color:#e11d48;font-size:13px}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:3px;background:var(--acc);opacity:.35;animation:tk 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tk{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-3px)}}
.chat-empty{max-width:780px;margin:8vh auto 0;text-align:center}
.chat-empty h2{font-size:24px;margin-bottom:8px}
.chat-empty h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chat-empty p{color:var(--sub);font-size:13.5px;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 16px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.chat-inputbar{padding:12px 18px 16px}
.input-wrap{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;backdrop-filter:blur(18px)}
.input-wrap:focus-within{border-color:rgba(91,108,255,.5);box-shadow:0 0 0 3px rgba(91,108,255,.12)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:14.5px;line-height:1.6;max-height:200px;color:var(--ink)}
.send-btn{border:0;background:var(--grad);color:#fff;border-radius:12px;padding:9px 18px;font-size:14px;cursor:pointer;font-weight:600}
.send-btn.stop{background:#e11d48}
.hint{text-align:center;font-size:11px;color:var(--sub);margin-top:8px}
.skill-ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:10vh 16px;background:rgba(15,23,42,.35);backdrop-filter:blur(4px)}
.skill-ov.open{display:flex}
.skill-panel{width:100%;max-width:520px;background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(15,23,42,.25);overflow:hidden}
.skill-panel input{width:100%;border:0;outline:0;padding:15px 18px;font-size:15px;border-bottom:1px solid var(--line)}
.skill-list{max-height:50vh;overflow-y:auto;padding:8px}
.skill-item{padding:10px 12px;border-radius:10px;cursor:pointer}
.skill-item:hover{background:rgba(91,108,255,.08)}
.skill-item .n{font-size:14px;font-weight:600}
.skill-item .m{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-none{padding:26px;text-align:center;color:var(--sub);font-size:13px}
@media (max-width:760px){
  .menu-btn{display:block}
  .chat-side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 10px 40px rgba(15,23,42,.2)}
  .chat-app.side-open .chat-side{transform:none}
  .chat-scroll{padding:18px 12px 6px}
}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}.chip{transition:none}}
</style>
<link rel="icon" href="data:,"></head>
<body>
<div class="chat-app" id="app">
  <aside class="chat-side" id="side">
    <div class="side-head"><span class="logo">✦ AI 对话</span><button class="new-btn" id="newBtn">＋ 新对话</button></div>
    <nav class="side-nav" id="sideNav"><a href="index.html">首页</a><a href="docs.html">星文</a><a href="data.html">星数</a><a href="flow.html">星流</a><a href="brain.html">第二大脑</a><a href="skills.html">Skill 库</a><a href="settings.html">设置</a></nav><div class="side-list" id="sessList"></div>
    <div class="side-foot"><a href="index.html">← 返回工作台</a><button class="mini-btn" id="exportBtn">导出 MD</button></div>
  </aside>
  <main class="chat-main">
    <header class="chat-top">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="model-tag"><b>AI 对话工作台</b> · 流式 · 本地历史</div>
      <button class="skill-btn" id="skillBtn">✦ Skill</button>
    </header>
    <div class="chat-scroll" id="scroll">
      <div class="chat-empty" id="empty">
        <h2>每一次提问，都是一次<span>新星爆发</span>。</h2>
        <p>流式输出 · Markdown 渲染 · Skill 加持 · 会话本地保存，数据不出浏览器</p>
        <div class="chips">
          <button class="chip" data-q="帮我写一份本周工作周报，要点式呈现">写周报</button>
          <button class="chip" data-q="用通俗语言解释什么是 HTTP/2，并对比 HTTP/1.1">解释概念</button>
          <button class="chip" data-q="为「校园二手书交易」小程序做一次头脑风暴，列出 10 个功能点">头脑风暴</button>
          <button class="chip" data-q="把下面这段话润色得更专业：">润色文本</button>
        </div>
      </div>
      <div class="chat-inner" id="inner"></div>
    </div>
    <footer class="chat-inputbar">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 · Shift+Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
      <div class="hint">模型在 设置 页配置 · 多 Profile 自动兜底 · Enter 发送</div>
    </footer>
  </main>
</div>
<div class="skill-ov" id="skillOv">
  <div class="skill-panel">
    <input type="text" id="skillSearch" placeholder="搜索 Skill，点击填入输入框">
    <div class="skill-list" id="skillList"></div>
  </div>
</div>
<script src="js/skills/skills-builtin.data.js" defer></script>
<script src="js/skills/skill-schema.js" defer></script>
<script src="js/skills/skill-store.js" defer></script>
<script src="js/builtin-profile.js" defer></script>
<script src="js/at-cmdk.js" defer></script>
<script src="js/chat.js" defer></script>
<script src="js/s1-backup.js?v=1"></script><script src="js/sw-register.js?v=1"></script><script src="js/s1-io.js?v=2"></script></body>
</html>
