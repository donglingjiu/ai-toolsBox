<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nova · 模型服务配置</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--mut:#6b7280;--line:#e5e7eb;--pri:#4f6ef7}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0f1530;color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}header a{color:#c7d2fe;text-decoration:none;font-size:13px}
main{max-width:880px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
h2{font-size:16px;margin:2px 0 10px}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px}
button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--pri)}.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.muted{color:var(--mut);font-size:12px}.chip{font-size:12px;border-radius:99px;padding:5px 12px;background:#eef1ff;border-color:#dfe4ff}
.hint{font-size:12px;color:#92400e;background:#fef3c7;border-radius:8px;padding:6px 10px;margin-top:6px;display:none}
.tag{font-size:12px;color:var(--pri)}
.profile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.profile .m{color:var(--mut);font-size:12px;margin:2px 0 8px}
.badge{font-size:11px;border-radius:99px;padding:2px 8px;margin-left:6px}
.b-def{background:#dbeafe;color:#1d4ed8}.b-off{background:#f3f4f6;color:#6b7280}
.msg{font-size:12px;margin-top:6px;display:none;border-radius:8px;padding:6px 10px}
.ok{background:#dcfce7;color:#166534;display:block}.bad{background:#fee2e2;color:#991b1b;display:block}
</style>
<script src='js/builtin-profile.js'></script><script src='js/guard.js'></script></head>
<body>
<header><b>✦ Nova 设置</b><span class="muted" style="color:#9aa5d1">Key 仅存本机 localStorage，数据不出端</span>
<a href="index.html">首页</a><a href="flow.html">Flow 星流</a><a href="data.html">Data 星数</a><a href="docs.html">Docs 星文</a></header>
<main>
<div class="card muted" id="diag">读取配置中…</div>

<div class="card">
 <h2 id="formTitle">添加模型服务配置</h2>
 <div class="row" style="margin:0 0 6px" id="chips"></div>
 <label>名称</label><input type="text" id="f-name" placeholder="如：智谱GLM(代理)"/>
 <label>Base URL（填到 /v1 或 /api/paas/v4 这一级，结尾不带 /chat/completions）</label>
 <input type="text" id="f-url" placeholder="https://ai.donglingjiu.top/llm/bigmodel/api/paas/v4"/>
 <div class="hint" id="keyGuide"></div>
 <label>模型 ID</label><input type="text" id="f-model" placeholder="如 glm-4-flash / deepseek-chat"/>
 <label>API Key（留空=保留原 Key，编辑时适用）</label>
 <input type="password" id="f-key" placeholder="sk-…"/>
 <div class="row">
  <button class="primary" id="btn-save">添加 / 保存此配置</button>
  <button id="btn-clear">清空表单</button>
  <span class="tag" id="editTag" hidden></span>
 </div>
</div>

<div class="card">
 <h2>已保存配置 <span class="muted" id="count"></span></h2>
 <div class="row" style="margin:0 0 8px">
  <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="f-fo" style="width:auto">开启故障自动切换（默认配置网络/超时/429/5xx 时按顺序换下一个）</label>
 </div>
 <div id="list"></div>
</div>

<div class="card">
 <h2>备份 / 迁移（防换浏览器、换机丢失）</h2>
 <p class="muted">导出包含全部本地设置（含 Key），文件等同密码，请勿外传；换机后导入即恢复。</p>
 <div class="row">
  <button class="primary" id="btn-export">导出全部配置 (.json)</button>
  <button id="btn-import">导入配置</button>
  <input type="file" id="file" accept=".json,application/json" hidden/>
 </div>
</div>
</main>
<script>
"use strict";
/* ===== v3.1 · 与 js/app.js 完全一致的存储契约 =====
   localStorage["at_settings_v1"] = { llmProfiles:[{id,name,provider,baseUrl,apiKey,model,enabled,priority}], activeProfileId, llmFailover } */
const SKEY="at_settings_v1", OLD="nova_profiles_v1";
function getSettings(){try{return Object.assign({llmProfiles:[],activeProfileId:"",llmFailover:false},JSON.parse(localStorage.getItem(SKEY)||"{}"))}catch(e){return{llmProfiles:[],activeProfileId:"",llmFailover:false}}}
function saveSettings(patch){const s=getSettings();Object.keys(patch).forEach(k=>s[k]=patch[k]);localStorage.setItem(SKEY,JSON.stringify(s));return s}
function genId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function migrate(){const raw=localStorage.getItem(OLD);if(!raw)return;
 try{const a=JSON.parse(raw);if(Array.isArray(a)&&a.length){
  const s=getSettings();const have=new Set((s.llmProfiles||[]).map(p=>(p.name||"")+"|"+(p.baseUrl||"")));
  a.forEach(p=>{if(p&&p.baseUrl&&!have.has((p.name||"")+"|"+p.baseUrl)){
   if(!p.apiKey&&p.key)p.apiKey=p.key;
   if(!p.baseUrl&&p.baseURL)p.baseUrl=p.baseURL;
   s.llmProfiles.push(p);}});
  localStorage.setItem(SKEY,JSON.stringify(s));}}catch(e){}
 localStorage.removeItem(OLD);}
function load(){migrate();const s=getSettings();let L=Array.isArray(s.llmProfiles)?s.llmProfiles:[];
 /* 规范化：去重、补 id（持久化，杜绝随机 id 导致"默认"错乱）、key→apiKey 映射 */
 let ch=false;const seen=new Set();
 L=L.filter(function(p){if(!p||!p.baseUrl)return false;const k=(p.name||"")+"|"+p.baseUrl;if(seen.has(k))return false;seen.add(k);return true});
 L.forEach(function(p){if(!p.id){p.id=genId();ch=true}
  if(!p.apiKey&&p.key){p.apiKey=p.key;delete p.key;ch=true}
  if(!p.baseUrl&&p.baseURL){p.baseUrl=p.baseURL;delete p.baseURL;ch=true}});
 if(ch)saveList(L);
 return L}
function saveList(L){L.forEach(function(p,i){p.priority=(L.length-i)*10});saveSettings({llmProfiles:L})}
const of=p=>p.baseUrl||"";
const isOn=p=>p.enabled!==false;
const defId=()=>getSettings().activeProfileId;
const setDef=p=>saveSettings({activeProfileId:p.id});

/* ===== 主流服务商：Key 获取指引 + 一键预设 ===== */
const GUIDE={
 "open.bigmodel.cn":["https://bigmodel.cn/usercenter/apikeys","智谱开放平台 → 控制台 → API Keys。GLM-Flash 系列免费。官方域名不支持浏览器直连，Base URL 请用本站代理 https://ai.donglingjiu.top/llm/bigmodel/api/paas/v4"],
 "dashscope.aliyuncs.com":["https://bailian.console.aliyun.com/?apiKey=1#/api-key","阿里云百炼 → API-KEY → 创建。Base URL 用 https://dashscope.aliyuncs.com/compatible-mode/v1"],
 "api.deepseek.com":["https://platform.deepseek.com/api_keys","DeepSeek 开放平台 → API Keys（需充值，价格很低）。Base URL 用 https://api.deepseek.com"],
 "api.moonshot.cn":["https://platform.moonshot.cn/apikeys","Moonshot 开放平台 → API Key 管理。Base URL 用 https://api.moonshot.cn/v1"],
 "api.siliconflow.cn":["https://cloud.siliconflow.cn/account/ak","硅基流动 → API 密钥 → 新建。按量计费需余额（402=欠费）。模型 ID 以「模型广场」显示的完整名称为准"],
 "api.minimaxi.com":["https://platform.minimaxi.com/user-center/basic-information/interface-key","MiniMax 开放平台 → 接口密钥"],
 "generativelanguage.googleapis.com":["https://aistudio.google.com/apikey","Google AI Studio → Get API key（国内需海外网络）"],
 "api.openai.com":["https://platform.openai.com/api-keys","OpenAI Platform → API keys"],
 "openrouter.ai":["https://openrouter.ai/keys","OpenRouter → Keys → Create Key，一个 Key 调数百模型。Base URL 用 https://openrouter.ai/api/v1"]};
const ALIAS={bigmodel:"open.bigmodel.cn",dashscope:"dashscope.aliyuncs.com",deepseek:"api.deepseek.com",moonshot:"api.moonshot.cn",siliconflow:"api.siliconflow.cn",openai:"api.openai.com",openrouter:"openrouter.ai"};
const PRESETS=[["智谱GLM(代理)","https://ai.donglingjiu.top/llm/bigmodel/api/paas/v4","glm-4-flash"],
 ["DeepSeek","https://api.deepseek.com","deepseek-chat"],["千问","https://dashscope.aliyuncs.com/compatible-mode/v1","qwen-plus"],
 ["Kimi","https://api.moonshot.cn/v1","moonshot-v1-8k"],["硅基流动","https://api.siliconflow.cn/v1","deepseek-ai/DeepSeek-V3"],
 ["MiniMax","https://api.minimaxi.com","MiniMax-Text-01"],["OpenAI","https://api.openai.com/v1","gpt-4o-mini"],
 ["OpenRouter","https://openrouter.ai/api/v1","openai/gpt-4o-mini"]];
function guideFor(url){let h="";try{h=new URL(url).hostname;}catch(e){return null}
 if(h==="ai.donglingjiu.top"){const m=String(url).match(/\/llm\/([a-z0-9-]+)/i);const g=GUIDE[ALIAS[(m||[])[1]||""]];
  return g?[g[0],"走本站代理转发（不存 Key）。上游获取方式："+g[1]]:["#","本站代理路径 /llm/<厂商>/…，按厂商到其官网获取 Key"]}
 return GUIDE[h]||null}
function showGuide(){const u=document.getElementById("f-url").value.trim(),el=document.getElementById("keyGuide"),g=guideFor(u);
 if(g&&u){el.style.display="block";el.innerHTML='获取 Key：<a target="_blank" rel="noopener" href="'+g[0]+'">'+g[0]+"</a> —— "+g[1]}
 else if(u){el.style.display="block";el.textContent="未识别的服务商，请核对 Base URL（需 OpenAI 兼容端点）。"}
 else el.style.display="none"}
document.getElementById("f-url").addEventListener("input",showGuide);
const fName=document.getElementById("f-name"),fUrl=document.getElementById("f-url"),fModel=document.getElementById("f-model"),fKey=document.getElementById("f-key");
PRESETS.forEach(function(t){const b=document.createElement("button");b.className="chip";b.textContent=t[0];
 b.onclick=function(){fName.value=t[0];fUrl.value=t[1];fModel.value=t[2];showGuide()};document.getElementById("chips").appendChild(b)});

/* ===== 列表渲染 + 测试 ===== */
let editing=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){const L=load();document.getElementById("count").textContent="共 "+L.length+" 条";
 const s=getSettings();document.getElementById("f-fo").checked=!!s.llmFailover;
 const dn=defId();const dname=(L.filter(function(p){return p.id===dn})[0]||{}).name;
 document.getElementById("diag").textContent="存储契约 v3.1 · at_settings_v1 · llmProfiles "+L.length+" 条 · 默认："+(dname||"未设置")+" · 故障切换："+(s.llmFailover?"开":"关")+"（与 Flow/全部页面共用同一份数据）";
 const box=document.getElementById("list");box.innerHTML="";
 if(!L.length){box.innerHTML='<p class="muted">暂无配置。点上方预设一键填好地址和模型，再去对应官网拿 Key。</p>';return}
 L.forEach(function(p,i){const d=document.createElement("div");d.className="profile";
  const g=guideFor(of(p));
  d.innerHTML='<div><b>'+esc(p.name||"(未命名)")+'</b><span>'+
   (p.id===dn?'<span class="badge b-def">默认</span>':"")+(p.id===window.NOVA_BUILTIN_ID?'<span class="badge b-def" style="background:#fef3c7;color:#92400e">内置</span>':"")+(isOn(p)?"":'<span class="badge b-off">已停用</span>')+'</span>'+
   ' <button data-a="test">测试</button> <button data-a="def">设为默认</button> '+(p.id===window.NOVA_BUILTIN_ID?"":'<button data-a="tog">'+(isOn(p)?"停用":"启用")+'</button> ')+
   (i>0?'<button data-a="up">↑</button>':"")+(i<L.length-1?'<button data-a="down">↓</button>':"")+
   (p.id===window.NOVA_BUILTIN_ID?"":' <button data-a="edit">编辑</button> ')+(g?'<a target="_blank" rel="noopener" href="'+g[0]+'"><button>获取Key↗</button></a>':"")+
   (p.id===window.NOVA_BUILTIN_ID?"":' <button data-a="del" style="color:#dc2626">删除</button>')+
   '<div class="m">'+esc(p.model||"")+" · "+esc(of(p))+'</div><div class="msg"></div></div>';
  d.querySelector('[data-a=test]').onclick=async function(){const m=d.querySelector(".msg");m.className="msg";m.textContent="测试中…";m.style.display="block";
   const r=await testProfile(p);m.textContent=r.msg;m.className="msg "+(r.ok?"ok":"bad")};
  d.querySelector('[data-a=def]').onclick=function(){setDef(p);render()};
  var tg=d.querySelector('[data-a=tog]');if(tg)tg.onclick=function(){p.enabled=!isOn(p);saveList(load().map(function(x){return x.id===p.id?p:x}));render()};
  const up=d.querySelector('[data-a=up]');if(up)up.onclick=function(){const t=load();const x=t[i-1];t[i-1]=t[i];t[i]=x;saveList(t);render()};
  const dnB=d.querySelector('[data-a=down]');if(dnB)dnB.onclick=function(){const t=load();const x=t[i+1];t[i+1]=t[i];t[i]=x;saveList(t);render()};
  var eb=d.querySelector('[data-a=edit]');if(eb)eb.onclick=function(){editing=p.id;fName.value=p.name||"";fUrl.value=of(p);fModel.value=p.model||"";fKey.value="";
   const t=document.getElementById("editTag");t.hidden=false;t.textContent="正在编辑："+(p.name||of(p))+"（Key 留空则不修改）";
   document.getElementById("formTitle").textContent="编辑配置";showGuide();window.scrollTo({top:0,behavior:"smooth"})};
  var db=d.querySelector('[data-a=del]');if(db)db.onclick=function(){if(!confirm("删除「"+(p.name||of(p))+"」？"))return;const t=load().filter(function(x){return x.id!==p.id});saveList(t);render()};
  box.appendChild(d)})}
/* 测试路径与 app.js 真实调用一致：baseUrl + /chat/completions（Bearer） */
async function testProfile(p){const base=of(p).replace(/\/+$/,"");
 const t0=Date.now();
 try{const r=await fetch(base+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(p.apiKey||"")},
  body:JSON.stringify({model:p.model||"gpt-3.5-turbo",messages:[{role:"user",content:"ping"}],max_tokens:8,stream:false})});
  const txt=await r.text().catch(function(){return""});
  if(r.ok)return{ok:true,msg:"✅ 连通，返回 OK（"+(Date.now()-t0)+"ms）"};
  if(r.status===401||r.status===403)return{ok:false,msg:"Key 无效或无权限("+r.status+")"};
  if(r.status===402)return{ok:false,msg:"Key 有效但余额不足(402)：去服务商控制台充值，或换免费模型（如智谱 Flash 走本站代理）"};
  if(r.status===404)return{ok:false,msg:"路径不存在(404)：核对 Base URL 层级与模型 ID"};
  if(r.status===405)return{ok:false,msg:"405：请求落到静态托管——/llm 代理函数未生效"};
  if(r.status===429)return{ok:true,msg:"连通(429 限流)：地址与 Key 均有效，稍后重试即可"};
  return{ok:false,msg:"HTTP "+r.status+"："+txt.slice(0,140)}
 }catch(e){return{ok:false,msg:"网络/CORS 失败："+e.message+" —— open.bigmodel.cn 直连必失败，请用 https://ai.donglingjiu.top/llm/bigmodel/api/paas/v4"}}}

/* ===== 保存 ===== */
document.getElementById("btn-save").onclick=function(){const L=load(),name=fName.value.trim(),url=fUrl.value.trim().replace(/\/+$/,""),model=fModel.value.trim(),key=fKey.value.trim();
 if(!/^https:\/\//.test(url)){alert("Base URL 需以 https:// 开头");return}
 if(editing){const p=L.find(function(x){return x.id===editing});if(!p){alert("原配置不存在");return}
  p.name=name||p.name;p.baseUrl=url;p.model=model||p.model;if(key)p.apiKey=key;}
 else{L.push({id:genId(),name:name||url.replace(/^https?:\/\//,"").split("/")[0],provider:"openai-compatible",baseUrl:url,apiKey:key,model:model,enabled:true})}
 saveList(L);clearForm();render()};
function clearForm(){editing=null;fName.value=fUrl.value=fModel.value=fKey.value="";
 document.getElementById("editTag").hidden=true;document.getElementById("formTitle").textContent="添加模型服务配置";showGuide()}
document.getElementById("btn-clear").onclick=clearForm;
document.getElementById("f-fo").onchange=function(){saveSettings({llmFailover:this.checked});render()};

/* ===== 备份导出 / 导入 ===== */
document.getElementById("btn-export").onclick=function(){const dump={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);dump[k]=localStorage.getItem(k)}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(dump,null,2)],{type:"application/json"}));
 a.download="nova-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};
document.getElementById("btn-import").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=function(){try{const d=JSON.parse(r.result);
  if(!confirm("导入将合并覆盖同名本地设置，继续？"))return;
  Object.keys(d).forEach(function(k){localStorage.setItem(k,d[k])});alert("导入成功，刷新生效");location.reload()}
  catch(err){alert("文件无效：需为设置页导出的 .json")}};r.readAsText(f)};

render();
</script>
<link rel="stylesheet" href="css/nova-cmdk.css?v=1">
<script src="js/nova-core.js?v=1"></script>
<script src="js/at-cmdk.js" defer></script><script src="js/skills/skill-injector.js" defer></script><script src="js/skills/skill-picker.js" defer></script><script src="js/skills/skills-builtin.data.js" defer></script><script src="js/skills/skill-schema.js" defer></script><script src="js/skills/skill-store.js" defer></script></body>
</html>
