<script type="text/plain" id="mind-sample-doc"># Nova Mind 使用指南
## 快速上手
- 左侧粘贴或编写 Markdown
- 脑图实时生成，自动布局
- 滚轮缩放，拖拽平移
## 语法支持
- # 标题 → 主分支
- - 列表 → 子分支
- 表格、代码块在节点内渲染
## 典型用途
- 读书笔记与知识整理
- 项目规划与任务拆解
- 会议纪要与头脑风暴</script>
<script src="js/nova-core.js"></script>
<script src="js/vendor/d3.min.js"></script>
<script src="js/vendor/markmap-lib.min.js"></script>
<script src="js/vendor/markmap-view.min.js"></script>
<script>
(function () {
  var src = document.getElementById('mind-src');
  var svg = document.getElementById('mind-svg');
  var emptyBox = document.getElementById('mind-empty');
  var tip = document.getElementById('mind-tip');
  var stat = document.getElementById('mind-stat');
  var bFit = document.getElementById('mind-fit');
  var bDl = document.getElementById('mind-dl');
  var bSample = document.getElementById('mind-sample');
  var bClear = document.getElementById('mind-clear');
  var sampleDoc = document.getElementById('mind-sample-doc').textContent.trim();
  var KEY = 'nova_mind_src_v1';
  var mm = null, timer = null, rz = null;

  function fit() { if (mm) { try { mm.fit(); } catch (e) {} } }
  function fallbackRoot(text) {
    var root = { content: '文档', children: [] };
    var cur = null;
    text.split('\n').forEach(function (ln) {
      var m = ln.match(/^(#{1,4})\s+(.*)$/);
      if (m) { cur = { content: m[2].slice(0, 40), children: [] }; root.children.push(cur); }
      else if (cur && ln.trim() && cur.children.length < 6) { cur.children.push({ content: ln.trim().slice(0, 36), children: [] }); }
    });
    return root;
  }
  function mount(root) {
    if (!root) return;
    emptyBox.style.display = 'none';
    bDl.disabled = false;
    if (mm) { mm.setData(root); setTimeout(fit, 60); return; }
    mm = markmap.Markmap.create(svg, { autoFit: true, duration: 300, maxWidth: 280, spacingVertical: 8 }, root);
    setTimeout(fit, 80);
  }
  function render() {
    var text = src.value || '';
    var n = text.replace(/\s/g, '').length;
    stat.textContent = n ? (n + ' 字') : '';
    try { localStorage.setItem(KEY, text); } catch (e) {}
    if (n < 2) {
      if (mm) { try { mm.setData({ content: '', children: [] }); } catch (e) {} }
      emptyBox.style.display = 'flex';
      bDl.disabled = true;
      tip.textContent = '左侧编辑，右侧实时成图';
      return;
    }
    try {
      var tf = new markmap.Transformer();
      var r = tf.transform(text);
      if (r && typeof r.then === 'function') {
        tip.textContent = '渲染中…';
        r.then(function (res) { mount(res && res.root); tip.textContent = '拖拽平移 · 滚轮缩放 · 点节点折叠'; });
      } else { mount(r && r.root); tip.textContent = '拖拽平移 · 滚轮缩放 · 点节点折叠'; }
    } catch (e) { mount(fallbackRoot(text)); tip.textContent = '拖拽平移 · 滚轮缩放 · 点节点折叠'; }
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(render, 350); }
  src.addEventListener('input', schedule);
  bFit.addEventListener('click', fit);
  bSample.addEventListener('click', function () { src.value = sampleDoc; render(); });
  bClear.addEventListener('click', function () { src.value = ''; render(); src.focus(); });
  bDl.addEventListener('click', function () {
    try {
      var clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', svg.clientWidth || 1200);
      clone.setAttribute('height', svg.clientHeight || 800);
      clone.style.background = '#ffffff';
      var st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      st.textContent = '.markmap-foreign{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;font-size:14px;color:#1b2437}.markmap-foreign div{color:#1b2437;margin:2px 0}';
      clone.insertBefore(st, clone.firstChild);
      var data = new XMLSerializer().serializeToString(clone);
      var blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nova-mind.svg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 800);
      tip.textContent = 'SVG 已下载，用浏览器打开效果最佳';
    } catch (e) { tip.textContent = '下载失败：' + e.message; }
  });
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(fit, 180); });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  src.value = (saved && saved.replace(/\s/g, '').length > 2) ? saved : sampleDoc;
  render();
})();
</script>

/* mind-png-export-v2: data-url path (WHATWG html#10641: blob+foreignObject taints, data uri clean) */
(function(){
  var svg = document.getElementById('mind-svg');
  var dl = document.getElementById('mind-dl');
  if(!svg || !dl) return;
  var b = document.getElementById('mind-dl-png');
  if(!b){
    b = document.createElement('button');
    b.id = 'mind-dl-png'; b.className = 'mbtn'; b.type = 'button';
    b.textContent = '\u4e0b\u8f7d PNG';
    dl.parentNode.insertBefore(b, dl.nextSibling);
  }
  b.addEventListener('click', function(){
    if(!svg.childNodes.length){ alert('load a mindmap first'); return; }
    var clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    var pad = 20, vx, vy, vw, vh;
    try { var bv = svg.viewBox.baseVal; if(bv && bv.width > 0){ vx=bv.x; vy=bv.y; vw=bv.width; vh=bv.height; } } catch(e){}
    if(vw === undefined){ var gb = svg.getBBox(); vx=gb.x; vy=gb.y; vw=gb.width; vh=gb.height; }
    vx-=pad; vy-=pad; vw+=pad*2; vh+=pad*2;
    clone.setAttribute('viewBox', vx+' '+vy+' '+vw+' '+vh);
    var scale = 2;
    clone.setAttribute('width', Math.round(vw*scale));
    clone.setAttribute('height', Math.round(vh*scale));
    var css = '';
    for(var i=0;i<document.styleSheets.length;i++){
      try {
        var rules = document.styleSheets[i].cssRules || [];
        for(var j=0;j<rules.length;j++){
          var t = rules[j].cssText || '';
          if(t.indexOf('url(') > -1) continue;
          if(t.indexOf('markmap') > -1 || t.indexOf('mind-') > -1) css += t + '\n';
        }
      } catch(e){}
    }
    if(css){
      var st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      st.textContent = css;
      clone.insertBefore(st, clone.firstChild);
    }
    var str = new XMLSerializer().serializeToString(clone);
    var img = new Image();
    img.onload = function(){
      var c = document.createElement('canvas');
      c.width = Math.round(vw*scale); c.height = Math.round(vh*scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        c.toBlob(function(pb){
          if(!pb){ alert('png export failed: empty blob'); return; }
          var pu = URL.createObjectURL(pb);
          var a = document.createElement('a');
          a.href = pu; a.download = 'mindmap-' + Date.now() + '.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(pu); }, 2000);
        }, 'image/png');
      } catch(err){
        alert('PNG blocked: ' + err.message + ' | fo=' + (str.indexOf('foreignObject')>-1) + ' | urlCss=' + (css.indexOf('url(')>-1) + ' | ' + c.width + 'x' + c.height);
      }
    };
    img.onerror = function(){ alert('svg to image failed (parse)'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
  });
})();
</script>
