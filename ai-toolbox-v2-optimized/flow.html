<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Flow · 星流 — AI 交付流水线</title>
<meta name="description" content="Nova Flow — 需求分析 → 技术调研 → 方案设计 → 代码实现 → 交付评审，五阶段专家接力流水线。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2345E0C8' d='M12 2 14.4 9.6 22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/nova.css">
<link rel="stylesheet" href="css/nova-docs.css">
<link rel="stylesheet" href="css/tokens-light.css?v=3">
<link rel="stylesheet" href="css/nova-flow.css">
<script src='js/builtin-profile.js'></script><script src='js/guard.js'></script></head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="logo" href="index.html" aria-label="返回 Nova 首页">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2 14.4 9.6 22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4Z"/></svg>
      Nova <span class="logo__cn">Flow · 星流</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="docs.html">Docs</a><a href="data.html">Data</a><a href="flow.html" aria-current="page">Flow</a><a href="mind.html">Mind</a>
    </nav>
    <span class="topbar__spacer"></span>
    <button class="cmdk-btn" data-cmdk-open aria-label="打开 Nova Command 命令面板">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      搜索… <kbd>Ctrl K</kbd>
    </button>
  </div>
</header>

<main id="main" class="docs-main">
  <div id="api-banner" class="api-note" hidden>
    ⚠ 尚未配置模型 API（Profile）。请到经典工具箱 <a href="settings.html">设置页</a> 配置后刷新本页；流水线全程走你自己的 Key，数据不经第三方。
  </div>

  <div class="flow-layout">
    <aside class="flow-rail" aria-label="流水线阶段">
      <div id="rail-list"></div>
      <div class="rail-btns">
        <button id="run-all" class="btn btn--primary">▶ 一键全流程</button>
        <button id="stop-btn" class="btn btn--ghost btn--danger-ghost" disabled>■ 停止</button>
      </div>
      <details class="teams">
        <summary>专家团图谱（方法论）</summary>
        <div id="teams-box"></div>
      </details>
    </aside>

    <section class="flow-main">
      <div class="bar">
        <strong id="stage-title">需求分析</strong>
        <span id="model-badge" class="bar__note"></span>
        <span class="topbar__spacer"></span>
        <span id="flow-progress" class="bar__note"></span>
      </div>

      <div class="card in-card">
        <div id="req-group">
          <label class="field" for="requirement">产品需求描述（全流程起点）</label>
          <textarea id="requirement" class="fld ta" rows="4" placeholder="例如：给内部团队做一个周报自动汇总工具，能从群聊拉取消息、按人汇总、生成周报页面…"></textarea>
        </div>
        <label class="field" for="stage-input" id="in-label"></label>
        <textarea id="stage-input" class="fld ta" rows="2"></textarea>
        <div class="in-btns">
          <button id="run-stage" class="btn btn--primary">▶ 执行本阶段</button>
          <span class="bar__note" id="in-hint"></span>
        </div>
      </div>

      <div class="bar out-head">
        <strong id="out-title">产物</strong>
        <span id="out-meta" class="bar__note"></span>
        <span class="topbar__spacer"></span>
        <button id="copy-out" class="mini">复制</button>
        <button id="dl-out" class="mini">下载 .md</button>
        <button id="dl-all" class="mini">全流程 .md</button>
      </div>
      <div id="out-box" class="outbox"></div>
    </section>
  </div>
</main>

<script src="js/flow-prompts.js?v=14"></script>
<script src="js/app.js?v=14"></script>
<script src="js/nova-core.js?v=14"></script>
<script src="js/vendor/marked.min.js?v=14"></script>
<script src="js/vendor/highlight.min.js?v=14"></script>
<script src="js/md-render.js?v=14"></script>
<script src="js/nova-flow.js?v=14"></script>
</body>
</html>
